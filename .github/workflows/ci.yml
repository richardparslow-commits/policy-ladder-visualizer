name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.txt
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start app under test
        run: |
          python -m streamlit run streamlit_app.py --server.address 127.0.0.1 > /tmp/policy-app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
      - name: Exercise responsive UI with synthetic data
        env:
          APP_URL: http://127.0.0.1:8501/
          POLL_TIMEOUT_SECONDS: '60'
          TEST_BROWSER: ${{ matrix.browser }}
        run: python scripts/audit_viewports.py
      - name: Stop test app
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: local-layout-${{ matrix.browser }}
          path: audit_shots/
          retention-days: 3
          if-no-files-found: ignore
