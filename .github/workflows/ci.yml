name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.txt
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start app under test
        run: |
          python -m streamlit run streamlit_app.py --server.address 127.0.0.1 > /tmp/policy-app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
      - name: Exercise responsive UI with synthetic data
        env:
          APP_URL: http://127.0.0.1:8501/
          POLL_TIMEOUT_SECONDS: '60'
          TEST_BROWSER: ${{ matrix.browser }}
        run: python scripts/audit_viewports.py
      - name: Stop test app
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: local-layout-${{ matrix.browser }}
          path: audit_shots/
          retention-days: 3
          if-no-files-found: ignore
