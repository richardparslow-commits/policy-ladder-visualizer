name: Live deploy smoke test
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  verify-live:
    if: github.repository == 'richardparslow-commits/policy-ladder-visualizer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify the expected source is deployed
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
        run: python scripts/smoke_live.py
      - name: Audit responsive live UI
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
          POLL_TIMEOUT_SECONDS: '30'
        run: python scripts/audit_viewports.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-synthetic-screenshots
          path: |
            smoke_shots/
            audit_shots/
          retention-days: 3
          if-no-files-found: ignore
