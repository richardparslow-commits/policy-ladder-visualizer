name: Live deploy smoke test
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  verify-live:
    if: github.repository == 'richardparslow-commits/policy-ladder-visualizer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify the expected source is deployed
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
        run: python scripts/smoke_live.py
      - name: Audit responsive live UI
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
          POLL_TIMEOUT_SECONDS: '30'
        run: python scripts/audit_viewports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: live-synthetic-screenshots
          path: |
            smoke_shots/
            audit_shots/
          retention-days: 3
          if-no-files-found: ignore
