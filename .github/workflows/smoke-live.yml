# Verify the live deployment after every push to main, plus a nightly canary.
#
# Streamlit Cloud redeploys asynchronously, so the script settles briefly, polls until
# the app renders, then asserts the current UI markers. A red run here means the live
# site is broken or serving unexpected content — screenshots are attached as artifacts.
# The nightly schedule keeps the README badge honest between pushes: it catches outages,
# a sleeping app that will not wake, or Streamlit Cloud platform drift.
name: Live deploy smoke test

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"  # nightly 09:00 UTC (05:00 ET / 02:00 PT)
  workflow_dispatch:

concurrency:
  group: smoke-live
  cancel-in-progress: true

jobs:
  smoke-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wait for redeploy, then verify the live app renders
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
          TRIGGERED_BY: ${{ github.event_name }}
        run: python scripts/smoke_live.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-screenshots
          path: smoke_shots/
          if-no-files-found: ignore

  # Second job: catch layout regressions at desktop, tablet, and phone sizes
  # before they reach users. Same triggers and settle logic as the smoke job.
  audit-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Audit desktop, tablet, and phone layouts of the live app
        env:
          APP_URL: https://policy-ladder-visualizer.streamlit.app/
          TRIGGERED_BY: ${{ github.event_name }}
        run: python scripts/audit_viewports.py

      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-audit-screenshots
          path: audit_shots/
          if-no-files-found: ignore
